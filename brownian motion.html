<html>
<head>
  <meta charset="utf-8"></meta>
  <meta name="viewport" content="width=device-width"></meta>
  <title>MathJax example</title>
  <script id="MathJax-script" async
          src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph/distrib/jsxgraphcore.js" type="text/javascript" charset="UTF-8">
  </script>
  <style type="text/css">body{background-color: hsl(240, 100%, 40%);}
    p,br,form{color: hsl(0, 0%, 100%);}
    span{background-color: hsl(0, 0%, 100%);}
  </style>
</head>
<body>
  <form>
    Number of Stocks: 
    <select id="number">
        <option value="1"selected="">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="15">15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
    </select>
    <br/>
    <input type="button" value="run simulation" onclick="run()"/>
    <input type="button" value="clear screen" onclick="clearturtle()"/>
    <br/>
    Yield of all stocks <input type="text" value="" id="output"/>
    Yield of Stock1  <input type="text" value="" id="output0"/>
    Yield of Stock2  <input type="text" value="" id="output1"/>
    Yield of Stock3  <input type="text" value="" id="output2"/>
    Yield of Stock4  <input type="text" value="" id="output3"/>
</form>
  <div id="jxgbox" class="jxgbox" style="width:1000px; height:400px;"></div>
<p>

</p>
  <script>
var brd = JXG.JSXGraph.initBoard('jxgbox', {boundingbox: [-10, 100, 100, -100]});
var t = brd.create('turtle');

function run() {
  var i,j,dist,yield=0.0;
  var start,last=0.0;
  var total_yield=0.0;
  var out_n=0;
  var stepSize = 1; 
  brd.suspendUpdate();
  var nr = document.getElementById('number').value*1;
  var a =0;
  var b =0;
  for (i=0;i<nr;i++) {
     t.setPenColor(JXG.hsv2rgb(Math.round(Math.random()*(130-20)+60),Math.round(Math.random()*(1-0.7)+0.7),Math.round(Math.random()*(1-0.8)+0.8)));
     start = t.pos[1];
     for (j=0;j<30;j++) {  
         a = Math.random()*(180-0)*Math.cos(Math.random()*(1-1));
        t.right(a);
        t.forward(stepSize*Math.random()*(3-0));
        t.left(a);
     }
     last = t.pos[1];
     dist = last - start;
     yield += dist*100;
     console.log(yield);
     id = `output${out_n}`;
     out_n += 1;
     console.log(id);
     total_yield += yield;
     document.getElementById(id).value = (yield).toFixed(3);
     t.home();
  }
  document.getElementById('output').value = (total_yield).toFixed(3);

  brd.unsuspendUpdate();
}
function clearturtle() {
  t.cs();
}
  </script>    
</body>
</html>
